[tasks.setup]
description = "Install pinned development tools"
run = "mise install"

[tasks.fmt]
alias = "format"
description = "Format project source code"
depends = ["swift:format"]

[tasks."fmt:check"]
description = "Check source formatting"
depends = ["swift:format-check"]

[tasks.lint]
description = "Run static analysis"
depends = ["ci:lint", "swift:lint"]

[tasks.build]
description = "Build the library"
run = "swift build"

[tasks.test]
alias = "t"
description = "Run offline tests"
run = "swift test"

[tasks."test:native"]
description = "Test both pinned engines, text embeddings, Whistle speech and Mirage vision"
env.CACTUS_NATIVE_TEST = "1"
run = "swift test --filter NativeIntegrationTests"

[tasks."test:artifacts"]
description = "Download and verify every pinned engine wheel and weights archive"
env.CACTUS_ARTIFACT_TEST = "1"
run = "swift test --filter PinnedArtifactTests"

[tasks.check]
description = "Run the full local validation suite"
depends = ["fmt:check", "lint", "test"]

[tasks."pre-commit"]
alias = "prk"
description = "Run the full local development gate"
depends = ["check"]
